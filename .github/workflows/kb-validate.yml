# Adapted from nickprignano/2ndbrain (Apache-2.0) and changed for avd-second-brain; see scripts/kb/NOTICE.
name: kb-validate

# Checks the knowledge base on every change to it: front matter and YAML against the JSON Schemas,
# MADR decision records, links and anchors, leak patterns, generated files (indexes, tables,
# llms.txt) in sync, the family checks (no HCL anywhere in the repo, decision 0012), the KB scripts' unit tests, and the brain's leak guard over
# the KB (scripts/Test-KbLeaks.ps1). Secrets are covered by gitleaks in secrets.yml.

on:
  # Every PR, with no paths filter, so it can be a required check (decision 0015):
  # a required check that never reports would hold a PR forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - docs/knowledge/**
      - scripts/kb/**
      - scripts/Test-KbLeaks.ps1
      - scripts/AvdBrain.psm1
      - llms.txt
      # HCL anywhere in the repo fails the lane check (decision 0012).
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tf.json"
      - "**/*.hcl"
      - "**/*.pkr.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - name: Schema, links and leak patterns
        run: python3 scripts/kb/validate.py
      - name: Generated files in sync
        run: python3 scripts/kb/build.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/kb -v
      - name: Brain leak guard (GUIDs, UNC paths, machine names, denylist)
        shell: pwsh
        run: ./scripts/Test-KbLeaks.ps1
