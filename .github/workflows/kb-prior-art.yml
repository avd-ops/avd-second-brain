# Adapted from nickprignano/2ndbrain (Apache-2.0) and changed for avd-second-brain; see scripts/kb/NOTICE.
name: kb-prior-art

# Run a prior-art check from the Actions tab: searches the KB, sibling KBs, GitHub repos, code
# and issues for one or more topics and writes the report to the job summary, the log and a
# prior-art artifact. It runs on GitHub, so it works when the session that needs it can't reach
# GitHub search (build containers get HTTP 403 there): dispatch it and read the log or artifact.
# Read-only: it writes nothing to the repo.

on:
  workflow_dispatch:
    inputs:
      query:
        description: What are you about to build? One topic per line for several (e.g. "fslogix entra kerberos")
        required: true

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/kb/requirements.txt
      - name: Search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUERY: ${{ inputs.query }}
        run: |
          mkdir -p prior-art
          n=0
          while IFS= read -r q; do
            q="$(printf '%s' "$q" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$q" ] && continue
            n=$((n + 1))
            python3 scripts/kb/prior_art.py "$q" | tee "prior-art/$(printf '%02d' "$n").md"
          done <<< "$QUERY"
          [ "$n" -gt 0 ] || { echo "No topic given."; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prior-art
          path: prior-art/
