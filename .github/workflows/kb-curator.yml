# Adapted from nickprignano/2ndbrain (Apache-2.0) and changed for avd-second-brain; see scripts/kb/NOTICE.
name: kb-curator

# Weekly digest of new releases, docs and community repos from docs/knowledge/sources.toml,
# opened as an issue labelled kb-digest. A new digest closes older open ones nobody ticked
# anything in and nobody commented on; a digest with ticked items stays open until a maintainer labels it kb-accepted
# (kb-feedback turns it into a PR). On pull requests that touch the curator it runs as a dry run
# and writes the digest to the job summary instead.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: Look back this many days
        default: "8"
  pull_request:
    paths:
      - scripts/kb/**
      - docs/knowledge/sources.toml
      - .github/workflows/kb-curator.yml

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - name: Collect
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/kb/curate.py --since-days "${{ inputs.since_days || '8' }}" --output digest.md
      - name: Job summary
        run: cat digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open digest issue
        if: github.event_name != 'pull_request' && steps.collect.outputs.items != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create kb-digest --color 0e8a16 --description "Knowledge base curator digest" --force
          url=$(gh issue create --label kb-digest --title "KB digest: $(date -u +%F)" --body-file digest.md)
          new="${url##*/}"
          gh issue list --label kb-digest --state open --limit 100 --json number,body,comments > "$RUNNER_TEMP/open.json"
          for n in $(python3 scripts/kb/digest.py supersede --issues "$RUNNER_TEMP/open.json" --new "$new"); do
            gh issue close "$n" --reason "not planned" --comment "Superseded by #$new; nothing here was ticked or commented on."
          done
