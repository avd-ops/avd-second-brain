# This KB's settings for the family scripts. The family identity fields (name, title, topic_order,
# data) join this file with the next re-port of the family scripts from ai-brain; today only
# capture_check.py reads it.

# Decision 0013 (ai-brain 0011): what the Stop hook does when code changed without a KB entry
# ("block", "warn" or "off"). The kb-capture PR check runs either way. capture_ignore lists more
# paths that aren't code: wiki/ is generated by Update-BrainDocs.ps1, and knowledge/ is the brain's
# engine knowledge, which changes only by a reviewed harvest PR.
capture_hook = "block"
capture_ignore = ["wiki/**", "knowledge/**"]

# Decision 0015 (ai-brain 0014): a PR that only touches these paths turns on GitHub's auto-merge
# through the kb-auto-merge workflow. Off until the owner has turned on "Allow auto-merge" and the
# branch ruleset; a separate PR turns it on. Code, scripts, workflows, decisions and engine
# knowledge (knowledge/**) never qualify.
auto_merge = "off"
auto_merge_paths = ["docs/knowledge/**", "llms.txt"]
