# The knowledge base family: sibling KBs that share this KB's format and know about each other.
# Schema: schema/family.schema.json, the same in every KB. How it works:
# curation.md#staying-aligned-with-the-family. Add a sibling's repo once it's known, then add
# its two sources in sources.toml.
#
# Lanes (decision 0012): `claude_project` names the Claude project that does a sibling's work, and
# `not_here` lists work this project never does, with the sibling that owns it. An assistant that
# gets an ask in a `not_here` lane refers it to the owner instead of building it, and reads the
# owner's KB before researching anything near it. validate.py fails on a tracked file matching a
# `files` glob; prior_art.py prints the owner when a query matches `keywords`.

format_version: 1
projects:
- id: avd
  name: AVD
  self: true
  repo: avd-ops/avd-second-brain
  kb_path: docs/knowledge
  role: member
  focus: Azure Virtual Desktop itself, across its lifecycle (assess, inventory, deploy, operate), and the intelligence layer behind avd-swarm
  owns: [Azure Virtual Desktop platform, FSLogix, session host images in general, the AVD landing zone and its operations]
  format_version: 1
  claude_project: AVD
  builds_in: [avd-landing-zone, avd-swarm, avd-second-brain, avd-current-state, avd-liquidware deployment tooling, avd-ops]
  not_here:
  - topic: Terraform, Packer, OpenTofu or any other HCL. The AVD repos use Bicep, PowerShell and native Azure, Entra and Microsoft 365 tooling only
    owner: nerdio-hcl
    keywords: [terraform, packer, opentofu, hcl, tfvars, azurerm provider]
    files: ['*.tf', '*.tfvars', '*.tf.json', '*.hcl', '*.pkr.json']
  - topic: Nerdio Manager, its provider and scripted actions
    owner: nerdio-hcl
    keywords: [nerdio, nme]
  - topic: Liquidware products (ProfileUnity, FlexApp, Stratusphere, CommandCTRL). Their deployment tooling is built in avd-liquidware, never in avd-landing-zone; real-user assessments stay in the Liquidware project
    owner: liquidware
    keywords: [liquidware, profileunity, flexapp, stratusphere, commandctrl]
- id: 2ndbrain
  name: 2ndbrain
  repo: nickprignano/2ndbrain
  kb_path: docs/knowledge
  role: reference
  focus: The template that owns the family knowledge base format
  owns: [the family knowledge base format, its scripts and schemas]
  format_version: 1
- id: avd-ops
  name: avd-ops
  repo: avd-ops/avd-ops
  kb_path: docs/knowledge
  role: member
  focus: 'The front door for the AVD repos: avd-ops.dev, onboarding and user docs'
  owns: [onboarding and user-facing docs for the AVD repos, the avd-ops.dev site and design system]
  format_version: 1
- id: nerdio-hcl
  name: Nerdio HCL kit
  repo: nickprignano/nerdio-hcl
  kb_path: docs/knowledge
  role: member
  focus: 'Related project, separate from avd-ops: Nerdio Manager on Azure Virtual Desktop, deployed with Terraform and Packer'
  owns: [Nerdio Manager, the nerdio/nme provider, this kit's Terraform and Packer]
  format_version: 1
  claude_project: Nerdio
- id: liquidware
  name: Liquidware
  repo: nickprignano/avd-liquidware
  kb_path: docs/knowledge
  role: member
  focus: Liquidware products on virtual desktops, starting with Stratusphere UX in Azure
  owns: [Liquidware products, Stratusphere UX appliances, the Connector ID Key, the Stratusphere API,
    this repo's Bicep and PowerShell]
  format_version: 1
  claude_project: Liquidware
